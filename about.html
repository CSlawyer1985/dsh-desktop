<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body { height: 100%; margin: 0; background: #0b0e14; color: #c9d4e6;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px 32px; box-sizing: border-box; gap: 6px; }
  .logo { width: 68px; height: 68px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center; }
  .logo img { width: 100%; height: 100%; }
  .name { font-size: 18px; font-weight: 600; color: #fff; }
  .ver { font-size: 12px; color: #7c8aa5; }
  .author { margin-top: 14px; font-size: 13px; color: #9fb0cc; }
  .author a { color: #6f8cff; text-decoration: none; }
  .author a:hover { text-decoration: underline; }
  .disclaimer { margin-top: 16px; font-size: 11px; color: #55637d; line-height: 1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <img src="assets/about-logo.svg" alt="DeepSeek" />
    </div>
    <div class="name">DeepSeek Harness</div>
    <div class="ver">版本 <span id="ver"></span></div>
    <div class="author">
      作者 <a href="https://chenshi.ai" target="_blank" id="authorLink">CSlawyer</a>
      · <a href="https://chenshi.ai" target="_blank">chenshi.ai</a>
    </div>
    <div class="disclaimer">
      非官方社区封装 · 与 DeepSeek 官方无关<br />
      DeepSeek 名称与 logo 为其商标，仅用于指代其产品
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('ver').textContent = params.get('version') || '?';
  </script>
</body>
</html>
