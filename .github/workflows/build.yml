name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icon (official DeepSeek logo on black)
        run: node scripts/make-icon-render.js && npx electron scripts/render-icon.js

      # --- macOS：签名 + 公证 ---
      # 需要仓库 Secrets：MAC_CSC_LINK（p12 的 base64）、MAC_CSC_KEY_PASSWORD、
      # APPLE_ID（Apple 账号邮箱）、APPLE_APP_SPECIFIC_PASSWORD（App 专用密码）、APPLE_TEAM_ID
      # 未配置 Secret 时自动降级为不签名构建（可正常打包，仅首次打开有 Gatekeeper 提示）
      - name: Build mac installer (dmg + zip, signed & notarized)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --x64 --arm64 -c.mac.notarize=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # --- Windows：Authenticode 签名 ---
      # 需要仓库 Secrets：WIN_CSC_LINK（pfx 的 base64）、WIN_CSC_KEY_PASSWORD
      # 可选：Azure Trusted Signing（见 docs/SIGNING.md）
      - name: Build windows installer (nsis + portable, signed)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --arm64
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build linux installer (AppImage)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
