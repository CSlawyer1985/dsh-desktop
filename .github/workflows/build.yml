name: build

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build mac icon (icns from committed png)
        if: runner.os == 'macOS'
        run: bash scripts/make-icns.sh

      # macOS：图标 icns + 签名/公证（未配置密钥时自动降级为不签名构建）
      - name: Build mac installer (dmg + zip)
        if: runner.os == 'macOS'
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac --x64 --arm64 -c.mac.notarize=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npx electron-builder --mac --x64 --arm64
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Windows：Authenticode 签名（未配置密钥时自动降级）
      - name: Build windows installer (nsis + portable)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --win --x64 --arm64
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            npx electron-builder --win --x64 --arm64
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build linux installer (AppImage)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
