name: build

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            name: macOS arm64
            os: macos-latest
            platform: darwin
            arch: arm64
            app_dir: dist/mac-arm64/DeepSeek Harness.app
          - id: macos-x64
            name: macOS x64
            os: macos-15-intel
            platform: darwin
            arch: x64
            app_dir: dist/mac/DeepSeek Harness.app
          - id: windows-arm64
            name: Windows arm64
            os: windows-11-arm
            platform: win32
            arch: arm64
            app_dir: dist/win-arm64-unpacked
          - id: windows-x64
            name: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
            app_dir: dist/win-unpacked
          - id: linux-x64
            name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            app_dir: dist/linux-unpacked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test bundled runtime and website
        run: npm test

      - name: Build mac icon (icns from committed png)
        if: matrix.platform == 'darwin'
        run: bash scripts/make-icns.sh

      # macOS：图标 icns + 签名/公证（未配置密钥时自动降级为不签名构建）
      - name: Build mac installer (dmg + zip)
        if: matrix.platform == 'darwin'
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac --${{ matrix.arch }} -c.mac.notarize=true --publish never
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npx electron-builder --mac --${{ matrix.arch }} --publish never
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Windows：Authenticode 签名（未配置密钥时自动降级）
      - name: Build windows installer (nsis + portable)
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --win --${{ matrix.arch }} --publish never
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            npx electron-builder --win --${{ matrix.arch }} --publish never
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build linux installer (AppImage)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify bundled runtime in packaged app
        shell: bash
        run: >-
          node scripts/verify-packaged-runtime.js
          "${{ matrix.app_dir }}"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.id }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
